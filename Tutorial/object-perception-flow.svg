<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Object perception flow</title>
  <desc id="desc">An RGB image is filtered by a region of interest, processed by a color or AI detector, and converted into a structured object detection.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#005EB8"/><stop offset="1" stop-color="#278AC6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="22" fill="#F8FAFC"/>
  <rect width="1200" height="8" rx="4" fill="url(#bar)"/>
  <text x="600" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#16324F">Object Perception</text>
  <text x="600" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Turn camera pixels into a structured target detection</text>

  <g fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)">
    <path d="M245 205H290"/><path d="M515 205H560"/><path d="M835 205H880"/>
  </g>

  <g filter="url(#shadow)"><rect x="35" y="115" width="210" height="180" rx="16" fill="#FFF" stroke="#CBD5E1"/><rect x="35" y="115" width="210" height="9" rx="4" fill="#005EB8"/></g>
  <g transform="translate(94 143)" fill="none" stroke="#005EB8" stroke-width="5" stroke-linejoin="round">
    <rect x="0" y="5" width="68" height="48" rx="7"/><circle cx="34" cy="29" r="14"/><path d="M68 17L90 8V50L68 41Z"/>
  </g>
  <text x="140" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">RGB Image</text>
  <text x="140" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Color and appearance</text>
  <text x="140" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">from the camera</text>

  <g filter="url(#shadow)"><rect x="290" y="115" width="225" height="180" rx="16" fill="#FFF" stroke="#CBD5E1"/><rect x="290" y="115" width="225" height="9" rx="4" fill="#1473C9"/></g>
  <g transform="translate(358 140)" fill="none" stroke-width="4">
    <rect x="0" y="0" width="88" height="60" rx="6" stroke="#94A3B8"/>
    <rect x="18" y="12" width="52" height="36" rx="3" stroke="#1473C9" stroke-dasharray="7 5"/>
    <circle cx="44" cy="30" r="8" fill="#DCEEFE" stroke="#1473C9"/>
  </g>
  <text x="402" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Preprocessing</text>
  <text x="402" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">ROI, resize, filtering</text>
  <text x="402" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">and color conversion</text>

  <g filter="url(#shadow)"><rect x="560" y="105" width="275" height="200" rx="16" fill="#FFF" stroke="#CBD5E1"/><rect x="560" y="105" width="275" height="9" rx="4" fill="#278AC6"/></g>
  <text x="697" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Detection</text>
  <rect x="587" y="158" width="96" height="66" rx="10" fill="#EAF4FD" stroke="#278AC6"/>
  <circle cx="615" cy="181" r="12" fill="#E15241"/><circle cx="648" cy="181" r="12" fill="#2E9B61"/>
  <text x="635" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">HSV profile</text>
  <text x="708" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#94A3B8">or</text>
  <rect x="732" y="158" width="76" height="66" rx="10" fill="#E8F8F7" stroke="#00A6A6"/>
  <path d="M746 207V175L758 185L770 168L794 207Z" fill="none" stroke="#00A6A6" stroke-width="3"/>
  <text x="770" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">AI model</text>
  <text x="697" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Find and validate the target region</text>
  <text x="697" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">for the selected object</text>

  <g filter="url(#shadow)"><rect x="880" y="115" width="285" height="180" rx="16" fill="#FFF" stroke="#CBD5E1"/><rect x="880" y="115" width="285" height="9" rx="4" fill="#00A6A6"/></g>
  <g transform="translate(912 145)" fill="none" stroke="#00A6A6" stroke-width="4">
    <rect x="0" y="0" width="82" height="62" rx="5"/><rect x="19" y="13" width="46" height="36" rx="3"/><circle cx="42" cy="31" r="5" fill="#00A6A6"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12.5" fill="#334155">
    <text x="1015" y="156">Object class / color</text><text x="1015" y="177">Bounding box / contour</text>
    <text x="1015" y="198">Center pixel (u, v)</text><text x="1015" y="219" font-size="12.5">Quality / frame ID</text>
  </g>
  <text x="1022" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Detection Result</text>
  <text x="1022" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Input for pose estimation</text>

  <text x="600" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">The detector can change while the downstream manipulation pipeline remains consistent.</text>
</svg>
