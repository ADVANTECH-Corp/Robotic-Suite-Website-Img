<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Motion planning flow</title>
  <desc id="desc">An object pose is converted into task-specific end-effector targets. MoveIt 2 combines those targets with the current state, robot model, planning scene, and constraints to produce a collision-free, time-parameterized joint trajectory.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#278AC6"/><stop offset="1" stop-color="#139CAA"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748B"/></marker>
  </defs>
  <rect width="1200" height="430" rx="22" fill="#F8FAFC"/><rect width="1200" height="8" rx="4" fill="url(#bar)"/>
  <text x="600" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#16324F">Motion Planning</text>
  <text x="600" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Convert a task goal into a valid, time-parameterized joint trajectory</text>
  <g fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"><path d="M235 215H270"/><path d="M525 215H560"/><path d="M850 215H885"/></g>

  <g transform="translate(25 110)">
    <rect width="210" height="210" rx="16" fill="#FFF" stroke="#CBD5E1" filter="url(#shadow)"/><rect width="210" height="9" rx="4" fill="#278AC6"/>
    <text x="105" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Object Pose</text>
    <g transform="translate(54 59)" fill="none" stroke-linecap="round"><circle cx="51" cy="39" r="16" fill="#E8F8F7" stroke="#00A6A6" stroke-width="4"/><path d="M51 39H91" stroke="#E15241" stroke-width="4"/><path d="M51 39V6" stroke="#2E9B61" stroke-width="4"/><path d="M51 39L27 63" stroke="#278AC6" stroke-width="4"/></g>
    <text x="105" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">Pose in robot planning frame</text>
    <text x="105" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Not sent directly to the planner</text>
  </g>

  <g transform="translate(270 100)">
    <rect width="255" height="230" rx="16" fill="#FFF" stroke="#CBD5E1" filter="url(#shadow)"/><rect width="255" height="9" rx="4" fill="#1473C9"/>
    <text x="127" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Task Target Generation</text>
    <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">
      <rect x="27" y="62" width="92" height="36" rx="8" fill="#EAF4FD"/><text x="73" y="85" text-anchor="middle">Pre-grasp</text>
      <rect x="136" y="62" width="92" height="36" rx="8" fill="#E8F8F7"/><text x="182" y="85" text-anchor="middle">Grasp</text>
      <rect x="27" y="109" width="92" height="36" rx="8" fill="#F1F5F9"/><text x="73" y="132" text-anchor="middle">Lift</text>
      <rect x="136" y="109" width="92" height="36" rx="8" fill="#FFF4E5"/><text x="182" y="132" text-anchor="middle">Place</text>
      <rect x="81" y="156" width="92" height="36" rx="8" fill="#F3EEFA"/><text x="127" y="179" text-anchor="middle">Retreat</text>
    </g>
    <text x="127" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#64748B">Tool offset, approach, object geometry</text>
  </g>

  <g transform="translate(560 90)">
    <rect width="290" height="250" rx="18" fill="#FFF" stroke="#139CAA" stroke-width="2" filter="url(#shadow)"/><rect width="290" height="10" rx="5" fill="#139CAA"/>
    <text x="145" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#16324F">MoveIt 2 Planning</text>
    <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">
      <rect x="22" y="63" width="118" height="33" rx="7" fill="#EAF4FD"/><text x="81" y="84" text-anchor="middle">Current joint state</text>
      <rect x="150" y="63" width="118" height="33" rx="7" fill="#E8F8F7"/><text x="209" y="84" text-anchor="middle">URDF / SRDF</text>
      <rect x="22" y="106" width="118" height="33" rx="7" fill="#FFF4E5"/><text x="81" y="127" text-anchor="middle">Planning scene</text>
      <rect x="150" y="106" width="118" height="33" rx="7" fill="#F3EEFA"/><text x="209" y="127" text-anchor="middle">Limits / constraints</text>
    </g>
    <g font-family="Arial, sans-serif" font-size="13" fill="#334155"><text x="44" y="172">1. Inverse kinematics</text><text x="44" y="195">2. Collision-free path search</text><text x="44" y="218">3. Time parameterization</text></g>
    <text x="145" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8" fill="#64748B">Controller config is needed for execution, not planning alone</text>
  </g>

  <g transform="translate(885 110)">
    <rect width="290" height="210" rx="16" fill="#FFF" stroke="#CBD5E1" filter="url(#shadow)"/><rect width="290" height="9" rx="4" fill="#00A6A6"/>
    <text x="145" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Validated Joint Trajectory</text>
    <g transform="translate(36 66)" fill="none" stroke-linecap="round"><circle cx="2" cy="62" r="5" fill="#139CAA" stroke="#139CAA"/><circle cx="216" cy="11" r="5" fill="#00A6A6" stroke="#00A6A6"/><path d="M2 62C43 4 73 96 111 44S174 74 216 11" stroke="#139CAA" stroke-width="4.5"/><rect x="80" y="35" width="28" height="28" rx="4" fill="#FDE8E5" stroke="#E15241" stroke-width="3"/></g>
    <text x="145" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">Joint positions and timing</text>
    <text x="145" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Velocity and acceleration within limits</text>
    <text x="145" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#00A6A6">Ready for Arm Action</text>
  </g>

  <rect x="185" y="367" width="830" height="38" rx="9" fill="#FFF" stroke="#CBD5E1"/>
  <text x="600" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Planning validity depends on the current state, coordinate frame, collision geometry, and configured limits.</text>
</svg>
