<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Vision-based manipulation workflow</title>
  <desc id="desc">A manipulation workflow organized into sensing, perception, planning, and action.</desc>

  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#005EB8"/>
      <stop offset="1" stop-color="#00A6A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="22" fill="#F8FAFC"/>
  <rect width="1200" height="8" rx="4" fill="url(#header)"/>

  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#16324F">
    Vision-Based Manipulation Workflow
  </text>
  <text x="600" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748B">
    Sensing  -  Perception  -  Planning  -  Action
  </text>

  <g fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)">
    <path d="M285 190H325"/>
    <path d="M575 190H615"/>
    <path d="M865 190H905"/>
  </g>

  <!-- Sensing -->
  <g filter="url(#shadow)">
    <rect x="35" y="105" width="250" height="175" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="35" y="105" width="250" height="10" rx="5" fill="#005EB8"/>
  </g>
  <g transform="translate(105 130)" fill="none" stroke="#005EB8" stroke-width="5" stroke-linejoin="round">
    <rect x="0" y="8" width="66" height="43" rx="7"/>
    <circle cx="33" cy="29.5" r="13"/>
    <path d="M66 19L87 10V49L66 40Z"/>
  </g>
  <text x="160" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#16324F">Sensing</text>
  <text x="160" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">RGB-D Camera</text>
  <text x="160" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#64748B">RGB, depth, CameraInfo</text>

  <!-- Perception -->
  <g filter="url(#shadow)">
    <rect x="325" y="105" width="250" height="175" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="325" y="105" width="250" height="10" rx="5" fill="#278AC6"/>
  </g>
  <g transform="translate(376 128)">
    <g fill="none" stroke="#278AC6" stroke-width="4">
      <rect x="0" y="4" width="58" height="48" rx="6"/>
      <path d="M10 40L23 28L33 36L45 21L50 40Z"/>
      <path d="M18 14H8V24M40 14H50V24M18 42H8V32M40 42H50V32" stroke="#00A6A6"/>
    </g>
    <path d="M67 29H88" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(98 2)" fill="none" stroke-linecap="round">
      <circle cx="25" cy="27" r="14" fill="#E6F6F6" stroke="#00A6A6" stroke-width="4"/>
      <circle cx="25" cy="27" r="4" fill="#00A6A6"/>
      <path d="M25 27L51 27" stroke="#E15241" stroke-width="3.5"/>
      <path d="M25 27L25 4" stroke="#2E9B61" stroke-width="3.5"/>
      <path d="M25 27L9 43" stroke="#278AC6" stroke-width="3.5"/>
    </g>
  </g>
  <text x="450" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#16324F">Perception</text>
  <text x="450" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">Detection and Pose Estimation</text>
  <text x="450" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#64748B">Object target, 3D pose, TF</text>

  <!-- Planning -->
  <g filter="url(#shadow)">
    <rect x="615" y="105" width="250" height="175" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="615" y="105" width="250" height="10" rx="5" fill="#139CAA"/>
  </g>
  <g transform="translate(686 132)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="48" r="6" fill="#139CAA" stroke="#139CAA"/>
    <circle cx="91" cy="8" r="6" fill="#00A6A6" stroke="#00A6A6"/>
    <path d="M7 48C22 4 52 72 91 8" stroke="#139CAA" stroke-width="5" stroke-dasharray="8 7"/>
    <rect x="39" y="23" width="19" height="19" rx="3" fill="#FDE8E5" stroke="#E15241" stroke-width="3"/>
  </g>
  <text x="740" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#16324F">Planning</text>
  <text x="740" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">Motion Planning</text>
  <text x="740" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#64748B">Collision-checked trajectory</text>

  <!-- Action -->
  <g filter="url(#shadow)">
    <rect x="905" y="105" width="260" height="175" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="905" y="105" width="260" height="10" rx="5" fill="#00A6A6"/>
  </g>
  <g transform="translate(985 128)" fill="none" stroke="#00A6A6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 58H78"/>
    <path d="M23 58L31 34L52 20L70 34"/>
    <circle cx="31" cy="34" r="6" fill="#FFFFFF"/>
    <circle cx="52" cy="20" r="6" fill="#FFFFFF"/>
    <path d="M70 34V49"/>
    <path d="M61 49H79M61 49V58M79 49V58"/>
  </g>
  <text x="1035" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#16324F">Action</text>
  <text x="1035" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">Arm and Gripper Action</text>
  <text x="1035" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#64748B">Controller, feedback, hardware</text>

  <rect x="150" y="312" width="900" height="1" fill="#CBD5E1"/>
  <text x="600" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">
    Sensor data becomes understanding, a safe plan, and monitored physical motion
  </text>
</svg>
