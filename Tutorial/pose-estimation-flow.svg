<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Pose estimation flow</title>
  <desc id="desc">A center pixel, aligned depth, and camera intrinsics are converted into a camera-frame 3D estimate and transformed into the robot planning frame.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1473C9"/><stop offset="1" stop-color="#00A6A6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748B"/></marker>
  </defs>
  <rect width="1200" height="420" rx="22" fill="#F8FAFC"/><rect width="1200" height="8" rx="4" fill="url(#bar)"/>
  <text x="600" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#16324F">Pose Estimation</text>
  <text x="600" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Convert an image detection into a robot-usable 3D target</text>

  <g fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"><path d="M270 211H315"/><path d="M555 211H600"/><path d="M825 211H870"/></g>

  <g filter="url(#shadow)"><rect x="30" y="105" width="240" height="215" rx="16" fill="#FFF" stroke="#CBD5E1"/><rect x="30" y="105" width="240" height="9" rx="4" fill="#1473C9"/></g>
  <text x="150" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Inputs</text>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="160" width="190" height="39" rx="8" fill="#EAF4FD"/><text x="150" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Center pixel (u, v)</text>
    <rect x="55" y="209" width="190" height="39" rx="8" fill="#E8F8F7"/><text x="150" y="234" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Aligned depth Z</text>
    <rect x="55" y="258" width="190" height="39" rx="8" fill="#F1F5F9"/><text x="150" y="283" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">CameraInfo: fx, fy, cx, cy</text>
  </g>

  <g filter="url(#shadow)"><rect x="315" y="120" width="240" height="185" rx="16" fill="#FFF" stroke="#CBD5E1"/><rect x="315" y="120" width="240" height="9" rx="4" fill="#278AC6"/></g>
  <text x="435" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">3D Deprojection</text>
  <g font-family="Consolas, monospace" font-size="14" fill="#334155">
    <text x="350" y="201">X = (u - cx) * Z / fx</text><text x="350" y="231">Y = (v - cy) * Z / fy</text><text x="350" y="261">Z = measured depth</text>
  </g>
  <text x="435" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#64748B">Pinhole model, rectified image</text>

  <g filter="url(#shadow)"><rect x="600" y="105" width="225" height="215" rx="16" fill="#FFF" stroke="#CBD5E1"/><rect x="600" y="105" width="225" height="9" rx="4" fill="#139CAA"/></g>
  <text x="712" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Camera-Frame Estimate</text>
  <g transform="translate(660 157)" fill="none" stroke-linecap="round">
    <circle cx="52" cy="43" r="18" fill="#E8F8F7" stroke="#00A6A6" stroke-width="4"/><circle cx="52" cy="43" r="5" fill="#00A6A6"/>
    <path d="M52 43L98 43" stroke="#E15241" stroke-width="4"/><path d="M52 43L52 4" stroke="#2E9B61" stroke-width="4"/><path d="M52 43L22 73" stroke="#278AC6" stroke-width="4"/>
  </g>
  <text x="712" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Position: X, Y, Z</text>
  <text x="712" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Approx. image-plane orientation</text>
  <text x="712" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#E15241">Not a complete 3D orientation</text>

  <g filter="url(#shadow)"><rect x="870" y="105" width="300" height="215" rx="16" fill="#FFF" stroke="#CBD5E1"/><rect x="870" y="105" width="300" height="9" rx="4" fill="#00A6A6"/></g>
  <text x="1020" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Planning-Frame Target</text>
  <rect x="902" y="165" width="236" height="48" rx="9" fill="#E8F8F7" stroke="#00A6A6"/>
  <text x="1020" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">TF: camera frame → planning frame</text>
  <g transform="translate(946 230)" fill="none" stroke="#00A6A6" stroke-width="4" stroke-linecap="round">
    <path d="M0 44H145"/><path d="M30 44L48 20L73 35L101 9L130 31"/><circle cx="48" cy="20" r="5" fill="#FFF"/><circle cx="101" cy="9" r="5" fill="#FFF"/>
  </g>
  <text x="1020" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">Transformed 3D position</text>
  <text x="1020" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#334155">Grasp orientation defined by task</text>
  <text x="1020" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#64748B">Usually robot base / MoveIt planning frame</text>

  <rect x="172" y="350" width="856" height="42" rx="10" fill="#FFF4E5" stroke="#F0B35B"/>
  <text x="600" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7C4A03">RGB and depth must be aligned, and the camera-to-robot transform must be calibrated.</text>
</svg>
