<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Arm action command and feedback flow</title>
  <desc id="desc">A common ros2_control architecture. A trajectory goal flows from MoveIt or task logic through a FollowJointTrajectory action, joint trajectory controller, command interfaces, and robot driver to the arm. Measured joint state returns through hardware state interfaces to the controller and joint state broadcaster, which publishes joint states to MoveIt and state monitors.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#139CAA"/><stop offset="1" stop-color="#00A6A6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity=".14"/></filter>
    <marker id="arrowCommand" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#139CAA"/></marker>
    <marker id="arrowFeedback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#E27A3F"/></marker>
    <marker id="arrowStatus" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7C5CBF"/></marker>
  </defs>
  <rect width="1200" height="500" rx="22" fill="#F8FAFC"/><rect width="1200" height="8" rx="4" fill="url(#bar)"/>
  <text x="600" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#16324F">Arm Action</text>
  <text x="600" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748B">A common ros2_control command and measured-state feedback architecture</text>
  <text x="35" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#139CAA">TRAJECTORY GOAL / CANCEL REQUEST</text>

  <g fill="none" stroke="#139CAA" stroke-width="3" marker-end="url(#arrowCommand)">
    <path d="M220 180H260"/><path d="M455 180H495"/><path d="M725 180H765"/><path d="M985 180H1025"/>
  </g>
  <path d="M610 249V267H122V230" fill="none" stroke="#7C5CBF" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowStatus)"/>
  <text x="366" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7C5CBF">ACTION FEEDBACK / RESULT</text>

  <g transform="translate(25 130)">
    <rect width="195" height="100" rx="14" fill="#FFF" stroke="#CBD5E1" filter="url(#shadow)"/><rect width="195" height="8" rx="4" fill="#278AC6"/>
    <text x="97" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" font-weight="700" fill="#16324F">MoveIt / Task Logic</text>
    <text x="97" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">Validated trajectory goal</text>
    <text x="97" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#64748B">Monitor result and cancellation</text>
  </g>

  <g transform="translate(260 130)">
    <rect width="195" height="100" rx="14" fill="#FFF" stroke="#CBD5E1" filter="url(#shadow)"/><rect width="195" height="8" rx="4" fill="#139CAA"/>
    <text x="97" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" font-weight="700" fill="#16324F">ROS 2 Action</text>
    <text x="97" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8" fill="#334155">FollowJointTrajectory</text>
    <text x="97" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2" fill="#64748B">Goal, feedback, result, cancel</text>
  </g>

  <g transform="translate(495 120)">
    <rect width="230" height="120" rx="14" fill="#FFF" stroke="#CBD5E1" filter="url(#shadow)"/><rect width="230" height="8" rx="4" fill="#139CAA"/>
    <text x="115" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" font-weight="700" fill="#16324F">Trajectory Controller</text>
    <text x="115" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8" fill="#334155">joint_trajectory_controller</text>
    <text x="115" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2" fill="#64748B">Compares desired and measured state</text>
    <text x="115" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2" fill="#64748B">Checks path and goal tolerances</text>
  </g>

  <g transform="translate(765 120)">
    <rect width="220" height="120" rx="14" fill="#FFF" stroke="#CBD5E1" filter="url(#shadow)"/><rect width="220" height="8" rx="4" fill="#00A6A6"/>
    <text x="110" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" font-weight="700" fill="#16324F">Command Interfaces</text>
    <text x="110" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">ros2_control hardware interface</text>
    <text x="110" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2" fill="#64748B">Robot driver / communication</text>
    <text x="110" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2" fill="#64748B">Position, velocity, or effort</text>
  </g>

  <g transform="translate(1025 130)">
    <rect width="150" height="100" rx="14" fill="#FFF" stroke="#00A6A6" stroke-width="2" filter="url(#shadow)"/><rect width="150" height="8" rx="4" fill="#00A6A6"/>
    <g transform="translate(33 17)" fill="none" stroke="#00A6A6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 52H82"/><path d="M18 52L29 32L49 18L68 32"/><circle cx="29" cy="32" r="5" fill="#FFF"/><circle cx="49" cy="18" r="5" fill="#FFF"/><path d="M68 32V46M60 46H76"/></g>
    <text x="75" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#16324F">Robot Arm</text>
  </g>

  <text x="35" y="287" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#E27A3F">MEASURED JOINT-STATE FEEDBACK</text>
  <g fill="none" stroke="#E27A3F" stroke-width="3" marker-end="url(#arrowFeedback)">
    <path d="M1100 230V325H970"/><path d="M750 370H720"/><path d="M500 370H465"/><path d="M255 370H220"/>
    <path d="M610 320V240"/>
  </g>

  <g transform="translate(750 320)">
    <rect width="220" height="100" rx="14" fill="#FFF" stroke="#F0B35B" filter="url(#shadow)"/><rect width="220" height="8" rx="4" fill="#E27A3F"/>
    <text x="110" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Hardware State Interfaces</text>
    <text x="110" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8" fill="#334155">Measured position / velocity / effort</text>
    <text x="110" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2" fill="#64748B">Read from joint sensors and driver</text>
  </g>

  <g transform="translate(500 320)">
    <rect width="220" height="100" rx="14" fill="#FFF" stroke="#F0B35B" filter="url(#shadow)"/><rect width="220" height="8" rx="4" fill="#E27A3F"/>
    <text x="110" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#16324F">ros2_control State</text>
    <text x="110" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8" fill="#334155">Available to active controllers</text>
    <text x="110" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2" fill="#64748B">Used for control and action feedback</text>
  </g>

  <g transform="translate(255 320)">
    <rect width="210" height="100" rx="14" fill="#FFF" stroke="#F0B35B" filter="url(#shadow)"/><rect width="210" height="8" rx="4" fill="#E27A3F"/>
    <text x="105" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16324F">joint_state_broadcaster</text>
    <text x="105" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">Publishes /joint_states</text>
    <text x="105" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2" fill="#64748B">Names and same-index values</text>
  </g>

  <g transform="translate(25 320)">
    <rect width="195" height="100" rx="14" fill="#FFF" stroke="#F0B35B" filter="url(#shadow)"/><rect width="195" height="8" rx="4" fill="#E27A3F"/>
    <text x="97" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">State Consumers</text>
    <text x="97" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">MoveIt, robot_state_publisher</text>
    <text x="97" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2" fill="#64748B">TF, RViz, and state monitors</text>
  </g>

  <rect x="138" y="452" width="924" height="30" rx="8" fill="#FFF" stroke="#CBD5E1"/>
  <text x="600" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#64748B">Arm Action is the execution stage, not a specific ROS 2 action type. Other robots may use vendor-specific control interfaces.</text>
</svg>
