<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <!-- column headers -->
  <text x="160" y="40" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.6" fill="#475569">TRAINING PAGE · POLICY</text>
  <text x="770" y="40" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.6" fill="#475569">INFERENCE PAGE · DEVICE</text>
  <line x1="55" y1="52" x2="265" y2="52" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="580" y1="52" x2="960" y2="52" stroke="#e2e8f0" stroke-width="2"/>

  <!-- connections: ACT (teal) -->
  <path d="M265,120 C410,120 435,98 580,98"   fill="none" stroke="#14b8a6" stroke-width="3"/>
  <path d="M265,120 C410,120 435,174 580,174" fill="none" stroke="#14b8a6" stroke-width="3"/>
  <path d="M265,120 C410,120 435,250 580,250" fill="none" stroke="#14b8a6" stroke-width="3"/>

  <!-- connections: GR00T (blue) -->
  <path d="M265,290 C410,290 435,250 580,250" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M265,290 C410,290 435,326 580,326" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- strategy boxes -->
  <rect x="55" y="82" width="210" height="76" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
  <text x="160" y="114" text-anchor="middle" font-size="21" font-weight="700" fill="#0f766e">ACT</text>
  <text x="160" y="138" text-anchor="middle" font-size="12.5" fill="#0f766e">Fixed motion, stable setup</text>

  <rect x="55" y="252" width="210" height="76" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="160" y="284" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">GR00T N1.5</text>
  <text x="160" y="308" text-anchor="middle" font-size="12.5" fill="#1d4ed8">Position or look varies</text>

  <!-- device boxes -->
  <rect x="580" y="70" width="380" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="604" y="104" font-size="17" font-weight="600" fill="#0f172a">CPU</text>
  <rect x="832" y="86" width="106" height="24" rx="12" fill="#e2e8f0"/>
  <text x="885" y="103" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.5" fill="#475569">DIRECT</text>

  <rect x="580" y="146" width="380" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="604" y="180" font-size="17" font-weight="600" fill="#0f172a">GPU (OpenVINO)</text>
  <rect x="832" y="162" width="106" height="24" rx="12" fill="#fed7aa"/>
  <text x="885" y="179" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.5" fill="#9a3412">CONVERT</text>

  <rect x="580" y="222" width="380" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="604" y="256" font-size="17" font-weight="600" fill="#0f172a">GPU (CUDA)</text>
  <rect x="832" y="238" width="106" height="24" rx="12" fill="#e2e8f0"/>
  <text x="885" y="255" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.5" fill="#475569">DIRECT</text>

  <rect x="580" y="298" width="380" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="604" y="332" font-size="17" font-weight="600" fill="#0f172a">GPU (TensorRT)</text>
  <rect x="832" y="314" width="106" height="24" rx="12" fill="#fed7aa"/>
  <text x="885" y="331" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.5" fill="#9a3412">CONVERT</text>

  <!-- the point: what is NOT connected -->
  <rect x="55" y="382" width="905" height="66" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="80" y="410" font-size="14" font-weight="700" fill="#b91c1c">The two paths never cross</text>
  <text x="80" y="433" font-size="13" fill="#7f1d1d">ACT cannot convert to TensorRT　·　GR00T N1.5 cannot run on CPU or OpenVINO　·　No line means not supported</text>
</svg>
