<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" width="1100" height="510" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="ah-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="510" fill="#ffffff"/>

  <!-- ── main flow ── -->
  <g stroke="#475569" stroke-width="2.5" marker-end="url(#ah)" fill="none">
    <line x1="190" y1="156" x2="212" y2="156"/>
    <line x1="385" y1="156" x2="407" y2="156"/>
    <line x1="580" y1="156" x2="602" y2="156"/>
    <line x1="825" y1="156" x2="867" y2="156"/>
  </g>
  <line x1="775" y1="156" x2="825" y2="156" stroke="#475569" stroke-width="2.5"/>
  <circle cx="825" cy="156" r="5" fill="#475569"/>

  <!-- ── loop back: saving → reset → recording ── -->
  <g stroke="#b45309" stroke-width="2.5" fill="none">
    <path d="M 825,156 V 349 H 783" marker-end="url(#ah-loop)"/>
    <path d="M 610,349 H 497 V 208" marker-end="url(#ah-loop)"/>
  </g>

  <!-- ── READY ── -->
  <rect x="25" y="112" width="165" height="88" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
  <text x="107" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">READY</text>
  <text x="107" y="163" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">“Ready to start”</text>
  <text x="107" y="182" text-anchor="middle" font-size="11" fill="#475569">Press Start</text>

  <!-- ── WARM-UP ── -->
  <rect x="248" y="80" width="108" height="24" rx="12" fill="#b45309"/>
  <text x="302" y="97" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#ffffff">RUNS ONCE</text>
  <line x1="302" y1="104" x2="302" y2="112" stroke="#b45309" stroke-width="1.5"/>
  <rect x="220" y="112" width="165" height="88" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="302" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">WARM-UP</text>
  <text x="302" y="163" text-anchor="middle" font-size="11" font-style="italic" fill="#b45309">“Warm-up in progress”</text>
  <text x="302" y="182" text-anchor="middle" font-size="11" fill="#b45309">Not recorded · warm-up time</text>

  <!-- ── RECORDING ── -->
  <rect x="415" y="112" width="165" height="88" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <circle cx="443" cy="137" r="5.5" fill="#dc2626"/>
  <text x="503" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">RECORDING</text>
  <text x="497" y="163" text-anchor="middle" font-size="11" font-style="italic" fill="#b91c1c">“Recording in progress”</text>
  <text x="497" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Recorded · episode time</text>

  <!-- ── SAVING ── -->
  <rect x="610" y="112" width="165" height="88" rx="9" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="692" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#3730a3">SAVING</text>
  <text x="692" y="163" text-anchor="middle" font-size="11" font-style="italic" fill="#4338ca">“Saving...”</text>
  <text x="692" y="182" text-anchor="middle" font-size="11" fill="#4338ca">Writes this episode</text>

  <!-- ── RESET (on the loop) ── -->
  <rect x="610" y="305" width="165" height="88" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="692" y="336" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">RESET</text>
  <text x="692" y="356" text-anchor="middle" font-size="11" font-style="italic" fill="#b45309">“Reset in progress”</text>
  <text x="692" y="375" text-anchor="middle" font-size="11" fill="#b45309">Not recorded · reset time</text>

  <!-- ── DONE ── -->
  <rect x="875" y="112" width="165" height="88" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="957" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">DONE</text>
  <text x="957" y="163" text-anchor="middle" font-size="11" font-style="italic" fill="#15803d">“Recording complete”</text>
  <text x="957" y="182" text-anchor="middle" font-size="11" fill="#15803d">Dataset written</text>

  <!-- ── branch labels (kept clear of every box) ── -->
  <line x1="850" y1="100" x2="850" y2="146" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="850" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Episode count reached</text>

  <text x="840" y="252" font-size="12.5" font-weight="700" fill="#b45309">Not finished → next episode</text>

  <!-- ── note ── -->
  <rect x="25" y="425" width="1050" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="48" y="450" font-size="13.5" font-weight="700" fill="#334155">Every episode runs Recording → Saving → Reset. Seeing these three cycle on screen is normal.</text>
  <text x="48" y="473" font-size="12.5" fill="#475569">Next Episode = end early and save　·　Retry = discard this episode and re-record　·　Finish = stop and write the dataset</text>
</svg>
